name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Integration tests need a real PostgreSQL (spec section 20.5). Trust
      # authentication keeps credentials out of the workflow entirely.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gobblet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/gobblet_test
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backup round trip of ADR-0032 shells out to pg_dump and pg_restore, and
      # both refuse an archive from a newer server. The runner image ships a client,
      # but the deploy this proves must not depend on which one, so a mismatch with
      # the service container is corrected here rather than skipped in the test.
      - name: PostgreSQL client tools
        run: |
          want=16
          have="$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -n1 || echo none)"
          echo "pg_dump reports major version ${have}, the service is ${want}"
          if [ "${have}" != "${want}" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install --yes "postgresql-client-${want}"
            echo "/usr/lib/postgresql/${want}/bin" >> "$GITHUB_PATH"
          fi

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Section 21.1: the two gates that are about the repository rather than the code.
      # Their names are asserted by apps/server/test/gates.test.ts against the gate
      # definitions, so a renamed step cannot quietly stop being a gate.
      - name: Dependency advisories
        run: pnpm audit --audit-level high --prod

      - name: Secret scan
        run: pnpm ops:secrets

      - name: Tests with coverage gates
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/
            apps/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

  browsers:
    name: Browser end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gobblet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/gobblet_test
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the two engines the suite runs, because the browsers are the slow part
      # of this job (docs/adr/0021).
      - name: Install browsers
        run: pnpm --filter @gobblet/e2e exec playwright install --with-deps chromium webkit

      - name: Play a match in Chromium and WebKit
        run: pnpm test:e2e

      # Always, not only on failure: a test that passes on its retry is reported
      # as flaky and leaves the only trace of why in the report.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
