name: Deploy

# The ordered jobs of specification section 22.2 and the runbooks of
# docs/operations.md sections 7 and 8. The host is Railway
# (docs/adr/0043-railway-hosts-the-deployment.md) and each job still requires the
# connection details of its environment, failing loudly when they are absent rather
# than reporting a deployment that did not happen.
#
# The drain is not a step here: it is drainingSeconds and overlapSeconds in
# apps/server/railway.json, matched to SHUTDOWN_DRAIN_SECONDS on the server. What this
# file owns is the order, the approval gate, and the refusal to call a release
# successful before the released version is the one answering.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to deploy. Must already be green on CI.
        required: true
        default: main
      skip-production:
        description: Deploy to staging only.
        type: boolean
        default: false
      skip-staging:
        description: >-
          Deploy straight to production, because no staging environment exists yet
          (docs/launch-blockers.md B1). The approval records that no rehearsal
          happened.
        type: boolean
        default: false
      rollback:
        description: >-
          Roll back instead of deploying forward: redeploy the ref above, skip
          migrations, and prove the rollback with the smoke check. See
          docs/operations.md section 9.
        type: boolean
        default: false

concurrency:
  # One deploy at a time. A queued deploy waits rather than racing the drain of
  # the one before it.
  group: deploy
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  build:
    name: Build the artefact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.identify.outputs.sha }}
      version: ${{ steps.identify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Identify the release
        id: identify
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${version} at ${sha}"

      - name: Build
        run: pnpm build
        env:
          APP_VERSION: ${{ steps.identify.outputs.version }}
          GIT_SHA: ${{ steps.identify.outputs.sha }}

      - name: Generate the alert rules from the definitions
        run: pnpm ops:alerts

      - name: The rules file must match the definitions
        run: git diff --exit-code ops/alerts/gobblet.rules.yml

      - name: Upload the server bundle
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ steps.identify.outputs.sha }}
          path: |
            apps/server/dist/
            apps/web/dist/
            packages/*/dist/
          retention-days: 14

  staging-migrate:
    name: Migrate staging
    needs: build
    # Two reasons to stand down: a rollback runs against the schema already there,
    # and staging may not exist yet.
    # A rollback runs against the schema that is already there. Migrations are
    # written to be backward compatible for exactly this reason
    # (docs/operations.md section 9), so rolling the code back never rolls the
    # schema back; a schema that has to move backward is a restore, not a rollback.
    if: ${{ !inputs.rollback && !inputs.skip-staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::No staging database is configured. See docs/operations.md section 2.1."
            exit 1
          fi

      - name: Back up before migrating
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:backup --directory "${RUNNER_TEMP}/backup"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Keep the pre-migration backup
        uses: actions/upload-artifact@v4
        with:
          name: staging-pre-migration-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/backup/
          retention-days: 14

  staging-deploy:
    name: Deploy staging
    needs: [build, staging-migrate]
    if: ${{ always() && !inputs.skip-staging && needs.build.result == 'success' && (needs.staging-migrate.result == 'success' || inputs.rollback) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Require a host
        env:
          HOST: ${{ vars.STAGING_URL }}
          SERVER_SERVICE: ${{ vars.RAILWAY_SERVER_SERVICE }}
          WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=""
          [ -z "${HOST}" ] && missing="${missing} STAGING_URL"
          [ -z "${SERVER_SERVICE}" ] && missing="${missing} RAILWAY_SERVER_SERVICE"
          [ -z "${WEB_SERVICE}" ] && missing="${missing} RAILWAY_WEB_SERVICE"
          [ -z "${RAILWAY_TOKEN}" ] && missing="${missing} RAILWAY_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::The staging environment is missing:${missing}. See docs/operations.md section 2.1 and docs/launch-blockers.md B1."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install the Railway CLI
        run: |
          npm install --global @railway/cli
          railway --version

      # The version and the commit are read by the server at runtime and reported on
      # /health/live, which is what the wait and the smoke check compare against.
      # --skip-deploys because the release below is the deploy.
      - name: Record what this release is
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            "APP_VERSION=${{ needs.build.outputs.version }}" \
            "GIT_SHA=${{ needs.build.outputs.sha }}" \
            --service "${{ vars.RAILWAY_SERVER_SERVICE }}" --skip-deploys

      # --ci returns when the build finishes, not when the container serves, which is
      # why the wait below exists. The platform starts the new container, waits for
      # /health/ready, moves traffic, then drains the old one per apps/server/railway.json.
      - name: Release the server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVER_SERVICE }}"

      - name: Release the client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_WEB_SERVICE }}"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for the released version to be the one serving
        env:
          RELEASE_BASE_URL: ${{ vars.STAGING_URL }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm --filter @gobblet/server await-release

  staging-smoke:
    name: Smoke staging
    needs: [build, staging-deploy]
    if: ${{ always() && needs.staging-deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Section 22.2 step 5 and docs/operations.md section 7: liveness, readiness,
      # the configuration document, and a match that plays a move, reconnects and
      # finds the version advanced.
      # APP_VERSION is what makes a rollback verifiable: the check fails unless the
      # version now serving is the version this run released, so a deployment that
      # silently did nothing cannot be reported as a successful rollback.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm --filter @gobblet/server smoke

  production-approval:
    name: Approve production
    needs: [build, staging-smoke]
    if: ${{ always() && needs.build.result == 'success' && !inputs.skip-production && (needs.staging-smoke.result == 'success' || inputs.skip-staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The gate itself. Reviewers are configured on the environment in repository
    # settings; the workflow cannot grant itself approval.
    environment: production
    steps:
      - name: Record the approval
        run: |
          echo "Approved ${{ needs.build.outputs.version }} at ${{ needs.build.outputs.sha }}"
          if [ "${{ inputs.skip-staging }}" = "true" ]; then
            echo "::warning::No staging rehearsal: this release goes to production untried. See docs/launch-blockers.md B1."
          else
            echo "Preconditions: staging smoke passed, migrations applied to staging, no open Sev1 or Sev2."
          fi

  production-migrate:
    name: Migrate production
    needs: [build, production-approval]
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::No production database is configured. See docs/operations.md section 2.1."
            exit 1
          fi

      - name: Back up before migrating
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:backup --directory "${RUNNER_TEMP}/backup"

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Keep the pre-migration backup
        uses: actions/upload-artifact@v4
        with:
          name: production-pre-migration-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/backup/
          retention-days: 14

  production-deploy:
    name: Deploy production and drain
    needs: [build, production-migrate]
    if: ${{ always() && needs.build.result == 'success' && (needs.production-migrate.result == 'success' || inputs.rollback) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Require a host
        env:
          HOST: ${{ vars.PRODUCTION_URL }}
          SERVER_SERVICE: ${{ vars.RAILWAY_SERVER_SERVICE }}
          WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          missing=""
          [ -z "${HOST}" ] && missing="${missing} PRODUCTION_URL"
          [ -z "${SERVER_SERVICE}" ] && missing="${missing} RAILWAY_SERVER_SERVICE"
          [ -z "${WEB_SERVICE}" ] && missing="${missing} RAILWAY_WEB_SERVICE"
          [ -z "${RAILWAY_TOKEN}" ] && missing="${missing} RAILWAY_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::The production environment is missing:${missing}. See docs/operations.md section 2.1 and docs/launch-blockers.md B1."
            exit 1
          fi

      # docs/operations.md section 8. The new container becomes ready before the old
      # one stops taking matchmaking, and the old one keeps its matches until they
      # finish or SHUTDOWN_DRAIN_SECONDS elapses. A client that is cut off calls
      # match:sync and loses nothing, which apps/server/test/phase7-exit-criteria.test.ts
      # proves against the runtime rather than against a deployment.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install the Railway CLI
        run: |
          npm install --global @railway/cli
          railway --version

      # The version and the commit are read by the server at runtime and reported on
      # /health/live, which is what the wait and the smoke check compare against.
      # --skip-deploys because the release below is the deploy.
      - name: Record what this release is
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway variable set \
            "APP_VERSION=${{ needs.build.outputs.version }}" \
            "GIT_SHA=${{ needs.build.outputs.sha }}" \
            --service "${{ vars.RAILWAY_SERVER_SERVICE }}" --skip-deploys

      # --ci returns when the build finishes, not when the container serves, which is
      # why the wait below exists. The platform starts the new container, waits for
      # /health/ready, moves traffic, then drains the old one per apps/server/railway.json.
      - name: Release the server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVER_SERVICE }}"

      - name: Release the client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_WEB_SERVICE }}"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for the released version to be the one serving
        env:
          RELEASE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm --filter @gobblet/server await-release

      - name: Watch the post-deploy window
        if: success()
        run: |
          echo "Error rate, readiness and match transaction failures for the observation window."
          echo "See ops/alerts/gobblet.rules.yml, GobbletErrorRegressionAfterDeploy."

  production-smoke:
    name: Smoke production
    needs: [build, production-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same check as staging, and the one that decides whether a rollback
      # worked: the version serving must be the version this run released.
      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm --filter @gobblet/server smoke

      - name: Say what happened
        run: |
          if [ "${{ inputs.rollback }}" = "true" ]; then
            echo "Rolled back to ${{ needs.build.outputs.version }} at ${{ needs.build.outputs.sha }}, and it is serving."
          else
            echo "Deployed ${{ needs.build.outputs.version }} at ${{ needs.build.outputs.sha }}, and it is serving."
          fi
