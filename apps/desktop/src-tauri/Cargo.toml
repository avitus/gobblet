[package]
name = "gobblet-desktop"
version = "0.1.0"
description = "Gobblet Online desktop shell"
authors = ["Gobblet Online"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "gobblet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
